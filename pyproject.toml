[project]
name = "agent-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-cli"]

[tool.uv]
package = false

[tool.uv.sources]
tj-cli = { git = "https://github.com/tj-agents/cli.git", rev = "76b85cc6543002611396f18384de37a8fb9c9fad", subdirectory = "packages/tj-cli" }

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.ruff]
include = [".agents/tests/test_shared_python_paths.py", "tests/conftest.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".agents/agent/utility/plugins/scripts/machine_paths.py", "tests/test_local_codex_refresh.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
explicit_package_bases = true
files = [".agents/tests/test_shared_python_paths.py", "tests/conftest.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".agents/agent/utility/plugins/scripts/machine_paths.py", "tests/test_local_codex_refresh.py"]
mypy_path = [".agents/agent/runtime", ".codex/runtime", "plugins/agent/.agents/agent/runtime", "tests"]

[[tool.mypy.overrides]]
module = ["host", "host_sessions", "repo_config", "test_required_plugins", "codex.*", "host_plugins", "required_plugins", "runtime_delivery", "tj_agent", "tj_agent.*", "agent_cli"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["lock_io"]
follow_imports = "silent"

[tool.pytest]
strict = true
testpaths = ["tests", ".agents/tests"]
pythonpath = ["tests", "plugins/agent/.agents/agent/runtime"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
