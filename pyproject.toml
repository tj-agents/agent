[project]
name = "agent-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-cli"]

[tool.uv]
package = false

[tool.uv.sources]
tj-cli = { git = "https://github.com/tj-agents/cli.git", rev = "9cb34d371bfdf29829cb6e2c7ddfde4c36943fec", subdirectory = "packages/tj-cli" }

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.ruff]
include = [".agents/tests/test_shared_python_paths.py", "tests/conftest.py", ".agents/agent/runtime/close_lifecycle.py", ".agents/agent/utility/close/scripts/agent_close.py", "tests/test_close_assessment_order.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", "tests/test_handoff_followup.py", ".codex/runtime/capacity.py", "tests/test_codex_capacity.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
files = [".agents/tests/test_shared_python_paths.py", "tests/conftest.py", ".agents/agent/runtime/close_lifecycle.py", ".agents/agent/utility/close/scripts/agent_close.py", "tests/test_close_assessment_order.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", "tests/test_handoff_followup.py", ".codex/runtime/capacity.py", "tests/test_codex_capacity.py"]
mypy_path = [".agents/agent/runtime", "plugins/agent/.agents/agent/runtime"]

[[tool.mypy.overrides]]
module = ["host", "host_sessions", "plugin_autoupdate", "close_fixtures", "repo_config", "test_codex_followup", "test_required_plugins"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["capacity"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["codex.*"]
follow_imports = "skip"

[tool.pytest]
strict = true
testpaths = ["tests", ".agents/tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
