[project]
name = "agent-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-cli"]

[tool.uv]
package = false

[tool.uv.sources]
tj-cli = { git = "https://github.com/tj-agents/cli.git", rev = "ba8308382b080c5031ee06f63223d147300400f1", subdirectory = "packages/tj-cli" }

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.ruff]
include = [".agents/tests/test_shared_python_paths.py", "tests/test_install_artefacts.py", "tests/conftest.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".agents/agent/utility/plugins/scripts/machine_paths.py", "tests/test_local_codex_refresh.py", ".agents/agent/runtime/work_items_install.py", "tests/test_work_items_install.py", ".agents/agent/runtime/retired_state.py", "tests/test_retired_state.py", ".agents/agent/runtime/jobs.py", ".agents/agent/runtime/plugin_copies.py", ".agents/agent/runtime/plugins/refresh.py", ".agents/agent/runtime/latest_plugins.py", "tests/test_plugin_copies.py", "tests/fake_machine.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
explicit_package_bases = true
files = [".agents/tests/test_shared_python_paths.py", "tests/test_install_artefacts.py", "tests/conftest.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".agents/agent/utility/plugins/scripts/machine_paths.py", "tests/test_local_codex_refresh.py", ".agents/agent/runtime/work_items_install.py", "tests/test_work_items_install.py", ".agents/agent/runtime/retired_state.py", "tests/test_retired_state.py", ".agents/agent/runtime/jobs.py", ".agents/agent/runtime/plugin_copies.py", ".agents/agent/runtime/plugins/refresh.py", ".agents/agent/runtime/latest_plugins.py", "tests/test_plugin_copies.py", "tests/fake_machine.py"]
mypy_path = [".agents/agent/runtime", ".codex/runtime", "plugins/agent/.agents/agent/runtime", "tests"]

[[tool.mypy.overrides]]
module = ["host", "plugins", "install", "host_sessions", "repo_config", "test_required_plugins", "claude.*", "codex.*", "host_plugins", "required_plugins", "runtime_delivery", "tj_agent", "tj_agent.*", "agent_cli"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["lock_io"]
follow_imports = "silent"

[tool.pytest]
strict = true
testpaths = ["tests", ".agents/tests"]
pythonpath = ["tests", "plugins/agent/.agents/agent/runtime"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
