[project]
name = "agent-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-cli"]

[tool.uv]
package = false

[tool.uv.sources]
tj-cli = { git = "https://github.com/tj-agents/cli.git", rev = "9cb34d371bfdf29829cb6e2c7ddfde4c36943fec", subdirectory = "packages/tj-cli" }

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.ruff]
include = [".agents/tests/test_shared_python_paths.py", "tests/conftest.py", ".agents/agent/runtime/close_lifecycle.py", ".agents/agent/utility/close/scripts/agent_close.py", "tests/test_close_assessment_order.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", "tests/test_handoff_followup.py", ".codex/runtime/backend.py", ".codex/runtime/handoff_runtime.py", ".codex/runtime/shell_commands.py", "tests/test_codex_shell_commands.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".codex/runtime/capacity.py", "tests/test_codex_capacity.py", ".codex/runtime/frontend_input.py", "tests/test_codex_observers.py", ".agents/agent/utility/plugins/scripts/machine_paths.py", "tests/test_local_codex_refresh.py", "tests/test_managed_admission.py", "tests/test_admission_source_coherence.py", "tests/test_observer_launch.py", "tests/test_hidden_observer_integration.py", "tests/fixtures/hidden_observer.py", ".agents/agent/runtime/managed_admission.py", "tests/test_owned_handoff_backend.py", "tests/test_owned_handoff_identity.py", "tests/test_owned_handoff_flow.py", "tests/test_owned_handoff_refresh.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
".agents/agent/runtime/managed_admission.py" = ["E402"]

[tool.mypy]
strict = true
warn_unreachable = true
explicit_package_bases = true
files = [".agents/tests/test_shared_python_paths.py", "tests/conftest.py", ".agents/agent/runtime/close_lifecycle.py", ".agents/agent/utility/close/scripts/agent_close.py", "tests/test_close_assessment_order.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", "tests/test_handoff_followup.py", ".codex/runtime/backend.py", ".codex/runtime/handoff_runtime.py", ".codex/runtime/shell_commands.py", "tests/test_codex_shell_commands.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".codex/runtime/capacity.py", "tests/test_codex_capacity.py", ".codex/runtime/frontend_input.py", "tests/test_codex_observers.py", ".agents/agent/utility/plugins/scripts/machine_paths.py", "tests/test_local_codex_refresh.py", "tests/test_managed_admission.py", "tests/test_admission_source_coherence.py", "tests/test_observer_launch.py", "tests/test_hidden_observer_integration.py", "tests/fixtures/hidden_observer.py", ".agents/agent/runtime/managed_admission.py", "tests/test_owned_handoff_backend.py", "tests/test_owned_handoff_identity.py", "tests/test_owned_handoff_flow.py", "tests/test_owned_handoff_refresh.py"]
mypy_path = [".agents/agent/runtime", ".codex/runtime", "plugins/agent/.agents/agent/runtime", "tests"]

[[tool.mypy.overrides]]
module = ["agent_cli", "host", "host_sessions", "plugin_autoupdate", "close_fixtures", "repo_config", "test_codex_followup", "test_native_completion", "test_required_plugins", "test_startup_binding", "codex.*", "host_plugins", "plugin_refresh", "required_plugins", "tj_agent", "tj_agent.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["lock_io"]
follow_imports = "silent"

[tool.pytest]
strict = true
testpaths = ["tests", ".agents/tests"]
pythonpath = ["tests", "plugins/agent/.agents/agent/runtime"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
