[project]
name = "agent-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-cli"]

[tool.uv]
package = false

[tool.uv.sources]
tj-cli = { git = "https://github.com/tj-agents/cli.git", rev = "92e29a7589a5dcf462af36d960684e49146d9d3b", subdirectory = "packages/tj-cli" }

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.ruff]
include = [".agents/tests/test_shared_python_paths.py", "tests/conftest.py", ".agents/agent/runtime/close_lifecycle.py", ".agents/agent/utility/close/scripts/agent_close.py", "tests/test_close_assessment_order.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", "tests/test_handoff_followup.py", ".codex/runtime/shell_commands.py", "tests/test_codex_shell_commands.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".codex/runtime/capacity.py", "tests/test_codex_capacity.py", ".codex/runtime/frontend_input.py", "tests/test_codex_observers.py", ".agents/agent/utility/plugins/scripts/machine_paths.py", "tests/test_local_codex_refresh.py", ".agents/agent/utility/plugins/scripts/plugin_runtime.py", "tests/test_process_boundaries.py", "tests/test_plugin_consoles.py", "tests/test_windows_process_visibility.py", "tests/test_runtime_cache_closure.py", "tests/fixtures/plugin_console_probe.py", "tests/fixtures/runtime_import_probe.py", "tests/test_process_runtime_delivery.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
explicit_package_bases = true
files = [".agents/tests/test_shared_python_paths.py", "tests/conftest.py", ".agents/agent/runtime/close_lifecycle.py", ".agents/agent/utility/close/scripts/agent_close.py", "tests/test_close_assessment_order.py", ".agents/agent/utility/plugins/scripts/config_conflicts.py", "tests/test_conflicted_plugin_settings.py", "tests/test_handoff_followup.py", ".codex/runtime/shell_commands.py", "tests/test_codex_shell_commands.py", ".agents/agent/runtime/native_runtime.py", "tests/test_native_runtime.py", ".codex/runtime/capacity.py", "tests/test_codex_capacity.py", ".codex/runtime/frontend_input.py", "tests/test_codex_observers.py", ".agents/agent/utility/plugins/scripts/machine_paths.py", "tests/test_local_codex_refresh.py", ".agents/agent/utility/plugins/scripts/plugin_runtime.py", "tests/test_process_boundaries.py", "tests/test_plugin_consoles.py", "tests/test_windows_process_visibility.py", "tests/test_runtime_cache_closure.py", "tests/fixtures/plugin_console_probe.py", "tests/fixtures/runtime_import_probe.py", "tests/test_process_runtime_delivery.py"]
mypy_path = [".agents/agent/runtime", ".codex/runtime", "plugins/agent/.agents/agent/runtime", ".agents/agent/utility/plugins/scripts", "tests"]

[[tool.mypy.overrides]]
module = ["host", "host_sessions", "plugin_autoupdate", "close_fixtures", "repo_config", "test_codex_followup", "test_required_plugins", "codex.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["lock_io"]
follow_imports = "silent"

[tool.pytest]
strict = true
testpaths = ["tests", ".agents/tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
