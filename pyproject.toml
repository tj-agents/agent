[project]
name = "agent-development"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-cli"]

[tool.uv]
package = false

[tool.python-standards]
mypy-groups = [[".agents", "tests"], [".claude/runtime"], [".codex/runtime"]]

[tool.uv.sources]
tj-cli = { git = "https://github.com/tj-agents/cli.git", rev = "364757479c8d7c4615e595c01019bdd158dd0819", subdirectory = "packages/tj-cli" }

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.1.1", "ruff>=0.17.4", "pytest-socket>=0.7.0"]

[tool.ruff]
extend-exclude = [".agents/sync_generated.py", ".agents/dependencies", ".codex/skills", ".claude/skills", ".codex/hooks/snapshot.py", ".codex/hooks/bootstrap.py", ".worktrees", ".template", "plugins"]
include = ["*.py", "*.pyi"]
target-version = "py312"

[tool.ruff.lint]
explicit-preview-rules = true
preview = true
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF", "PGH004", "ANN401", "G004", "PLW1514", "LOG002", "LOG015", "PLC2701", "ICN001", "TID251", "TRY300", "PT009", "PT011", "PT006", "PLR6301"]

[tool.mypy]
enable_error_code = ["ignore-without-code", "exhaustive-match"]
strict = true
warn_unreachable = true
explicit_package_bases = true
exclude = ['(^|/)(?:\.agents/sync_generated\.py|\.agents/dependencies/|\.codex/skills/|\.claude/skills/|\.codex/hooks/(?:snapshot|bootstrap)\.py|\.worktrees/|\.template/)', '^plugins/']
files = [".agents", "tests"]
mypy_path = [".agents/agent/runtime", "plugins/agent/.agents/agent/runtime", "tests"]

[[tool.mypy.overrides]]
module = ["host_permissions", "session_hook", "host", "plugins", "install", "host_sessions", "repo_config", "test_required_plugins", "claude.*", "codex.*", "host_plugins", "required_plugins", "runtime_delivery", "tj_agent", "tj_agent.*", "agent_cli", "agent_store", "lifecycle", "host_sessions"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["lock_io"]
follow_imports = "silent"

[tool.pytest]
strict = true
testpaths = ["tests", ".agents/tests"]
pythonpath = ["tests", "plugins/agent/.agents/agent/runtime"]
addopts = ["--import-mode=importlib", "-ra", "--disable-socket"]
filterwarnings = ["error"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase" = { "msg" = "Use plain pytest functions and bare assertions." }
"importlib.util.spec_from_file_location" = { "msg" = "Import the installed public API; do not load another checkout by path." }
"sys.path" = { "msg" = "Install the declared dependency; do not modify the import search path." }

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

[tool.ruff.lint.per-file-ignores]
"tests/test_tj_recover.py" = ["ANN401", "PLR6301"]
"tests/test_session_recovery.py" = ["ANN401", "PLR6301", "PT006"]
"tests/test_retired_state.py" = ["ANN401", "TID251"]
"tests/test_native_runtime.py" = ["TID251"]
"tests/test_local_codex_refresh.py" = ["TID251"]
"tests/test_latest_plugins.py" = ["ANN401"]
"tests/test_conflicted_plugin_settings.py" = ["PT011", "TID251"]
"tests/test_boot_history.py" = ["PT006"]
"tests/fake_machine.py" = ["ANN401"]
".agents/agent/utility/plugins/scripts/config_conflicts.py" = ["ANN401"]
".agents/agent/runtime/tj_recover.py" = ["TID251"]
".agents/agent/runtime/retired_state.py" = ["PLR6301", "TRY300"]
".agents/agent/runtime/latest_plugins.py" = ["TID251"]

