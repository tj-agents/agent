name: Delivery

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-release:
    name: Verify the pinned native CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect merged CLI changes awaiting release or pin advancement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_delivery.py --root . --latest
