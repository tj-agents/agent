name: Host Parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-capabilities:
    name: Check host declarations and behavior
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install the shared process boundary
        shell: pwsh
        run: |
          $cliRef = uv run python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['tool']['uv']['sources']['tj-cli']['rev'])"
          cargo install --locked --git https://github.com/tj-agents/cli --rev $cliRef --bin tj_hook tj-cli
      - name: Resolve implementations and tests at their pinned sources
        run: uv run python -B .agents/agent/runtime/capabilities.py --root .
      - name: Exercise both host adapters with fakes
        run: uv run pytest tests/test_capabilities.py tests/test_capability_contracts.py tests/test_tj_recover.py tests/test_hook_trust.py::test_installed_hooks_are_trusted_only_in_trusted_projects tests/test_install.py::NativePermissionsTests -q
