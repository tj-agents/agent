name: Host Parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-capabilities:
    name: Check host declarations and behavior
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Exercise both host adapters with fakes
        run: uv run pytest tests/test_capabilities.py tests/test_capability_contracts.py tests/test_tj_recover.py tests/test_hook_trust.py tests/test_install.py::NativePermissionsTests -q
